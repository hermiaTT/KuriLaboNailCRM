spring:
  application:
    name: kuri-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/kuri_labo}
    username: ${DATABASE_USER:kuri}
    password: ${DATABASE_PASSWORD:kuri_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 120MB

server:
  port: ${PORT:${SERVER_PORT:8080}}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

kuri:
  media:
    root: ${MEDIA_STORAGE_PATH:./data/media}
  auth:
    issuer: ${AUTH_ISSUER:kuri-api}
    access-token-minutes: ${ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${REFRESH_TOKEN_DAYS:30}
    # Development fallback only. Production must provide AUTH_TOKEN_SECRET.
    token-secret: ${AUTH_TOKEN_SECRET:kuri-local-development-secret-change-me}
    secure-cookie: ${AUTH_SECURE_COOKIE:false}

