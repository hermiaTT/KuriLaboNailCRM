name: kuri-labo

services:
  postgres:
    image: postgres:17-alpine
    container_name: kuri-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kuri_labo}
      POSTGRES_USER: ${POSTGRES_USER:-kuri}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kuri_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - kuri_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  kuri_postgres_data:

